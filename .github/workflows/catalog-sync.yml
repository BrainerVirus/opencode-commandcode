name: Catalog sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if command-code version is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CATALOG_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Unit tests
        run: bun test tests/unit/

      - name: Sync catalog
        env:
          CI: "true"
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workit lesson: setup-node writes NODE_AUTH_TOKEN into .npmrc.
          # NPM_TOKEN alone is an empty placeholder there.
          NPM_TOKEN: ${{ secrets.NPMJS }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS }}
        run: bun run scripts/catalog-sync-ci.ts
